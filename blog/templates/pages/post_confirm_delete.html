<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 450px;
            background: white;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #d63031;
        }

        p {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }

        .warning-text {
            margin-top: 10px;
            color: #c0392b;
            font-weight: bold;
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button,
        .cancel-btn {
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s ease-in-out;
        }

        button {
            background: #d63031;
            border: none;
            color: white;
        }

        button:hover {
            background: #b82424;
            transform: translateY(-1px);
        }

        .cancel-btn {
            background: #dfe6e9;
            color: #2d3436;
        }

        .cancel-btn:hover {
            background: #b2bec3;
            transform: translateY(-1px);
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Delete Post?</h2>

        <p>
            Are you sure you want to delete the post:<br>
            <strong>"{{ post.title }}"</strong>?
        </p>

        {% if comment_count > 0 %}
            <p class="warning-text">
                This post has {{ comment_count }} comment(s).  
                They will also be permanently deleted.
            </p>
        {% else %}
            <p class="warning-text">
                This post has no comments.
            </p>
        {% endif %}

        <form method="POST" class="btn-group">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'details' post.id %}" class="cancel-btn">Cancel</a>
        </form>
    </div>

</body>
</html>
