<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title.page_title }}</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    {% for book in books %}
        <div>
            <h1>{{ book.title }}</h1>
            <p>{{ book.author }}</p> <br>
        </div>
    {% endfor %}
</body>
</html>
