<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Except Admin Posts</title>
    <style>
        .parent {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    {% if posts %}
        {% for post in posts %}
            <div class="parent">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <p>
                    <small>{{ post.author }}</small>
                    <a href="{% url 'details' post.id %}">View more</a>
                </p>
            </div>
        {% endfor %}
    {% else %}
        <p>No Posts yet</p>
    {% endif %}
</body>
</html>
