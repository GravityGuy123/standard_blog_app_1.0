<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base</title>
    <style>
        /* --- Reset & Base --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            width: 100%;
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: #fff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            /* gap: 1.2rem; */
            column-gap: 1.2rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffeb3b;
        }

        /* --- Main --- */
        main {
            flex: 1;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* --- Footer --- */
        footer {
            width: 100%;
            background: #007bff;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            position: relative;
        }

        footer p {
            margin: 0;
        }

        /* --- Responsive --- */
        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                flex-wrap: wrap;
                width: 100%;
            }

            .nav-links a {
                padding: 8px 0;
            }

            main {
                margin: 1rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">My Website</div>
            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'profile' %}">Profile</a>
                <a href="{% url 'post' %}">Posts</a>
                <a href="{% url 'test' %}">Test</a>
                <a href="{% url 'test2' %}">Test2</a>
                <a href="{% url 'post_list' %}">Post List</a>
                <a href="{% url 'product_list' %}">Product List</a>
                <a href="{% url 'admin:index' %}">Admin</a>
                <a href="{% url 'create_post' %}">Create Post</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer>
        <p>&copy; 2025 My Website | Designed with ❤️ in Django</p>
    </footer>
</body>
</html>
