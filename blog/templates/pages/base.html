<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ user.username }}</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #1e293b; /* dark slate */
      color: #fff;
      position: relative;
      z-index: 100;
      flex-wrap: wrap; /* allows nav items to wrap to next line */
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8; /* accent color */
    }

    /* Desktop navigation */
    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap; /* wrap to next line if needed */
    }

    .nav-links li a {
      text-decoration: none;
      color: #cbd5e1; /* muted text */
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.3s;
      white-space: nowrap; /* prevent breaking inside link text */
    }

    .nav-links li a:hover {
      color: #fff;
      background-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background-color: #fff;
      display: block;
      transition: all 0.3s;
    }

    .hamburger.toggle span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.toggle span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.toggle span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* Mobile menu overlay */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(30, 41, 59, 0.95); /* dark overlay */
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 1.5rem;
      z-index: 90;
      padding: 2rem 1rem;
      max-height: 100vh; /* limit height */
      overflow-y: hidden; /* hide scrollbar by default */
    }

    /* Show scrollbar only on hover */
    .mobile-menu:hover {
      overflow-y: auto;
    }

    .mobile-menu a {
      display: inline-block; /* size wraps text */
      text-align: center;
      font-size: 1.5rem;
      color: #cbd5e1;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      transition: all 0.3s;
      text-decoration: none;
      white-space: nowrap;
    }

    .mobile-menu a:hover {
      background-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    /* Responsive */
    @media screen and (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .mobile-menu.active { display: flex; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Gravity Concepts</div>
    <nav class="nav">
      <ul class="nav-links">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'profile' %}">Profile</a></li>
        <li><a href="{% url 'post' %}">Posts</a></li>
        <li><a href="{% url 'test' %}">Test</a></li>
        <li><a href="{% url 'test2' %}">Test2</a></li>
        <li><a href="{% url 'post_list' %}">Post List</a></li>
        <li><a href="{% url 'product_list' %}">Product List</a></li>
        <li><a href="{% url 'admin:index' %}">Admin</a></li>
        <li><a href="{% url 'create_post' %}">Create Post</a></li>
        <li><a href="{% url 'logout' %}">Logout</a></li>
      </ul>
    </nav>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'profile' %}">Profile</a>
    <a href="{% url 'post' %}">Posts</a>
    <a href="{% url 'test' %}">Test</a>
    <a href="{% url 'test2' %}">Test2</a>
    <a href="{% url 'post_list' %}">Post List</a>
    <a href="{% url 'product_list' %}">Product List</a>
    <a href="{% url 'admin:index' %}">Admin</a>
    <a href="{% url 'create_post' %}">Create Post</a>
  </div>

  <main>{% block content %} {% endblock content %}</main>

  <footer>
    <p>&copy; 2025 My Website | Designed with ❤️ in Django</p>
  </footer>

  <script>
    const hamburger = document.getElementById("hamburger");
    const mobileMenu = document.getElementById("mobileMenu");

    hamburger.addEventListener("click", () => {
      mobileMenu.classList.toggle("active");
      hamburger.classList.toggle("toggle");

      // Prevent body scroll when mobile menu is open
      document.body.style.overflow = mobileMenu.classList.contains("active")
        ? "hidden"
        : "";
    });
  </script>
</body>
</html>
